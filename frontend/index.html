<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TutorSim</title>
  <meta name="description" content="TutorSim – gia sư luyện chữa bài với học sinh ảo, học sinh luyện đề và theo dõi điểm dự kiến." />
  <link rel="icon" href="assets/img/logo-shark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script>
    // Áp chế độ sáng/tối trước khi vẽ trang để không bị nháy màu
    try { var t = localStorage.getItem("tutorsim_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <!-- Latex rendering -->
  <script>
    window.MathJax = {
      tex: { 
        inlineMath: [['$', '$'], ['\\(', '\\)']] 
      },
      chtml: {
        displayAlign: 'left',
        displayIndent: '2em' // Optional: Adds an indent so it's not glued to the very edge
      },
      svg: {
        displayAlign: 'left',
        displayIndent: '2em' 
      }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
